name: Update bike network data

on:
  workflow_dispatch:        # "Run workflow" button on the Actions tab
  push:                     # also runs when the sorting rules or this script change
    branches: [main]
    paths:
      - classify.js
      - scripts/build-data.cjs
      - .github/workflows/update-data.yml

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download and classify OpenStreetMap data
        run: node scripts/build-data.cjs
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update bike network data from OpenStreetMap"
            git push
          fi
